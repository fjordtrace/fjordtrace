[project]
name = "signalpost-agent"
version = "0.1.0"
description = "Evidence-first research agent for Norwegian companies (Builderr Signalpost)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "requests==2.32.5",
  "lxml==6.0.2",
  "beautifulsoup4==4.14.2",
  "extruct==0.18.0",
  "tldextract==5.3.0",
  "pypdf==6.1.3",
]

[project.scripts]
signalpost = "signalpost.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
